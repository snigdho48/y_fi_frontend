name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to server
      run: |
        echo "${{ secrets.PEM_FILE }}" > private_key.pem
        chmod 600 private_key.pem
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.SERVER_URL }} << 'EOF'
          set -e
          FRONTEND_DIR="${FRONTEND_DIR:-/var/www/y_fi_frontend}"
          if [[ ! -d "$FRONTEND_DIR/.git" ]]; then
            sudo mkdir -p "$(dirname "$FRONTEND_DIR")"
            sudo git clone https://github.com/snigdho48/y_fi_frontend.git "$FRONTEND_DIR"
          fi
          cd "$FRONTEND_DIR"
          sudo bash deploy/deploy.sh
          echo "Deployment successful"
        EOF
        rm -f private_key.pem
